name: Test

on: [push, pull_request, workflow_dispatch]

permissions: {}

env:
  FORCE_COLOR: 1
  PIP_DISABLE_PIP_VERSION_CHECK: 1

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "pypy3.12"
          - "pypy3.11"
          - "3.15t"
          - "3.15"
          - "3.14t"
          - "3.14"
          - "3.13"
          - "3.12"
          - "3.11"
        os: [windows-latest, macos-latest, ubuntu-latest]

    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
          allow-prereleases: true

      - name: Set PYTHON_GIL
        if: endsWith(matrix.python-version, 't')
        run: |
          echo "PYTHON_GIL=0" >> "$GITHUB_ENV"

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.2

      - name: Tox tests
        run: |
          uvx --python ${{ matrix.python-version }} --with tox-uv tox -e py

      - name: Upload coverage
        uses: codecov/codecov-action@v7.1.1
        with:
          flags: ${{ matrix.os }}
          name: ${{ matrix.os }} Python ${{ matrix.python-version }}

  translations:
    name: Translation catalogs up to date
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Install gettext
        run: |
          sudo apt install gettext

      - name: Update translations
        run: |
          scripts/update-translations.sh

      - name: Check catalogs are up to date
        run: |
          if ! git diff --exit-code -I '^"POT-Creation-Date: ' -- src/humanize/locale; then
            echo "::error::Translation catalogs are out of date." \
              "Run scripts/update-translations.sh and commit the .po changes."
            exit 1
          fi

  success:
    if: always()
    needs: [test, translations]
    runs-on: ubuntu-latest
    name: Test successful
    steps:
      - name: Success
        env:
          TEST_RESULT: ${{ needs.test.result }}
          TRANSLATIONS_RESULT: ${{ needs.translations.result }}
        run: |
          test "$TEST_RESULT" = "success"
          test "$TRANSLATIONS_RESULT" = "success"
