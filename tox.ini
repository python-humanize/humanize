[tox]
requires =
    tox>=4.32
env_list =
    docs
    lint
    mypy
    py{py3}
    py{311-316}
    py{314-316}t

[testenv]
package = editable
deps =
    babel
extras =
    tests
pass_env =
    FORCE_COLOR
commands_pre =
    {[testenv:compile-translations]commands}
commands =
    {envpython} -m pytest \
      --cov humanize \
      --cov tests \
      --cov-report html \
      --cov-report term \
      --cov-report xml \
      {posargs}

[testenv:docs]
deps =
    -r docs/requirements.txt
commands_pre =
commands =
    mkdocs build

[testenv:lint]
skip_install = true
deps =
    prek
commands_pre =
commands =
    prek run --all-files --show-diff-on-failure

[testenv:mypy]
deps =
    -r requirements-mypy.txt
commands_pre =
commands =
    mypy . {posargs}

[testenv:compile-translations]
skip_install = true
deps =
    babel
commands =
    pybabel --quiet compile --directory src/humanize/locale --domain humanize

[pytest]
addopts = --color=yes --doctest-modules
